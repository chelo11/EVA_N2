apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Produccion: k3s en la instancia AWS EC2. Agrega el Ingress (Traefik) que
# publica la API en el puerto 80 de la instancia.
# Los transformers de la base (namespace, labels) solo afectan a los recursos de la
# base: lo que se agrega aqui (ingress.yaml) necesita su propio namespace.
namespace: vehiculos

resources:
  - ../../base
  - ingress.yaml

labels:
  - pairs:
      environment: production
      app.kubernetes.io/part-of: ms-vehiculos
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

images:
  - name: ms-vehiculos
    newName: ghcr.io/chelo11/ms-vehiculos
    newTag: latest   # scripts/render-manifests.sh lo reemplaza por el SHA del commit
