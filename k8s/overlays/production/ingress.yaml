# Traefik viene incluido en k3s y escucha en el puerto 80 del nodo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-vehiculos
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ms-vehiculos
                port:
                  name: http
