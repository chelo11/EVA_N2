# Valores por defecto y maximos por contenedor: si alguien agrega un contenedor
# sin requests/limits, recibe estos en lugar de consumir el nodo sin control.
apiVersion: v1
kind: LimitRange
metadata:
  name: limites-por-contenedor
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 1536Mi
