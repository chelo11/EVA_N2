# Escalado horizontal automatico: minimo 2 replicas (alta disponibilidad),
# maximo 4, segun uso de CPU. Requiere metrics-server (incluido en k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-vehiculos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-vehiculos
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Espera 5 min de carga baja antes de quitar pods (evita oscilaciones)
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
