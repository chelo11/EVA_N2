# Escalado horizontal automatico: minimo 2 replicas (alta disponibilidad),
# maximo 4, segun uso de CPU. Requiere metrics-server (incluido en k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-vehiculos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-vehiculos
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      # 1 pod por minuto: el pico de CPU del arranque de la JVM (p.ej. al encender el
      # laboratorio) dura menos de un minuto y no alcanza a llevar el HPA al maximo.
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # Espera 5 min de carga baja antes de quitar pods (evita oscilaciones)
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
