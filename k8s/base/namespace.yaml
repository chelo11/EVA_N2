# Pod Security Admission en modo "restricted": el API server rechaza cualquier
# pod que corra como root, escale privilegios o no declare seccomp.
apiVersion: v1
kind: Namespace
metadata:
  name: vehiculos
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
